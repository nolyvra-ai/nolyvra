spring:
  application:
    name: app

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12MB}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nolyvra}
    username: ${SPRING_DATASOURCE_USERNAME:nolyvra}
    password: ${SPRING_DATASOURCE_PASSWORD:nolyvrapass}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

analysis-jobs:
  max-parallel: ${ANALYSIS_JOBS_MAX_PARALLEL:3}
  max-attempts: ${ANALYSIS_JOBS_MAX_ATTEMPTS:3}
  worker-delay-ms: ${ANALYSIS_JOBS_WORKER_DELAY_MS:5000}

nolyvra:
  mock-ai: ${NOLYVRA_MOCK_AI:false}

coworker:
  analysis-pool-size: ${COWORKER_ANALYSIS_POOL_SIZE:3}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

coresignal:
  api-key: ${CORESIGNAL_API_KEY:}
  base-url: ${CORESIGNAL_BASE_URL:https://api.coresignal.com/cdapi/v2}

nexus:
  # Master feature toggle (2026-07-26) — off by default. NexusClient.isConfigured()
  # folds this in, which is already the single gate every Nexus-touching code path
  # checks before calling out (blended search, outbox dispatcher). Flip to true (or
  # set NEXUS_ENABLED=true) to re-enable the whole integration.
  enabled: ${NEXUS_ENABLED:false}
  # Local-dev defaults (2026-07-24) — the three secrets below must be set to the
  # exact same values in the local Nexus instance's own env config, or calls will
  # fail auth / dedup will silently stop matching. Set real env vars to override
  # these for any non-local environment.
  base-url: ${NEXUS_BASE_URL:http://localhost:8081}
  service-token: ${NOLYVRA_INTEGRATION_SERVICE_TOKEN:dev-only-shared-secret-change-me-before-any-real-deployment-0000}
  webhook-signing-secret: ${NOLYVRA_WEBHOOK_SIGNING_SECRET:dev-only-webhook-secret-change-me-before-any-real-deployment-0000}
  identity-token-secret: ${NOLYVRA_IDENTITY_TOKEN_SECRET:dev-only-identity-secret-change-me-before-any-real-deployment-0000}
  webhook-url: ${NOLYVRA_WEBHOOK_URL:http://localhost:8080/api/nexus/webhook}
  outbox:
    dispatch-delay-ms: ${NEXUS_OUTBOX_DISPATCH_DELAY_MS:15000}
  frontend-url: ${NEXUS_FRONTEND_URL:http://localhost:5174}

microsoft:
  client-id: ${MICROSOFT_CLIENT_ID:}
  client-secret: ${MICROSOFT_CLIENT_SECRET:}
  redirect-uri: ${MICROSOFT_REDIRECT_URI:http://localhost:8080/auth/microsoft/callback}
  frontend-url: ${MICROSOFT_FRONTEND_URL:http://localhost:5173}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
  frontend-url: ${GOOGLE_FRONTEND_URL:http://localhost:5173}

xero:
  client-id: ${XERO_CLIENT_ID:}
  client-secret: ${XERO_CLIENT_SECRET:}
  redirect-uri: ${XERO_REDIRECT_URI:http://localhost:8080/auth/xero/callback}
  frontend-url: ${XERO_FRONTEND_URL:http://localhost:5173}

hubspot:
  client-id: ${HUBSPOT_CLIENT_ID:}
  client-secret: ${HUBSPOT_CLIENT_SECRET:}
  redirect-uri: ${HUBSPOT_REDIRECT_URI:http://localhost:8080/auth/hubspot/callback}
  frontend-url: ${HUBSPOT_FRONTEND_URL:http://localhost:5173}
  deal-pipeline: ${HUBSPOT_DEAL_PIPELINE:default}
  deal-stage: ${HUBSPOT_DEAL_STAGE:appointmentscheduled}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Nolyvra <onboarding@resend.dev>}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-ids:
    token-pack-100:      ${STRIPE_PRICE_TOKEN_100:}
    token-pack-250:      ${STRIPE_PRICE_TOKEN_250:}
    token-pack-600:      ${STRIPE_PRICE_TOKEN_600:}
    token-pack-1500:     ${STRIPE_PRICE_TOKEN_1500:}
    plan-payg-monthly:   ${STRIPE_PRICE_PAYG_MONTHLY:}
    plan-payg-yearly:    ${STRIPE_PRICE_PAYG_YEARLY:}
    plan-bronze-monthly: ${STRIPE_PRICE_BRONZE_MONTHLY:}
    plan-bronze-yearly:  ${STRIPE_PRICE_BRONZE_YEARLY:}
    plan-silver-monthly: ${STRIPE_PRICE_SILVER_MONTHLY:}
    plan-silver-yearly:  ${STRIPE_PRICE_SILVER_YEARLY:}
    plan-gold-monthly:   ${STRIPE_PRICE_GOLD_MONTHLY:}
    plan-gold-yearly:    ${STRIPE_PRICE_GOLD_YEARLY:}
