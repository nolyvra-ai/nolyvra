# ─────────────────────────────────────────────────────────────────────────────
# nolyvra MVP2 — application.yml additions
# Add these blocks to your existing application.yml
# ─────────────────────────────────────────────────────────────────────────────

# ── Spring Mail (JavaMailSender) ──────────────────────────────────────────────
spring:
  mail:
    host: smtp.gmail.com          # Change to smtp.office365.com for Outlook
    port: 587
    username: your-email@gmail.com
    password: your-app-password   # Use Gmail App Password, NOT your account password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── CoreSignal integration ────────────────────────────────────────────────────
coresignal:
  api-key: ${CORESIGNAL_API_KEY:}    # Set via env var or replace here
  base-url: https://api.coresignal.com/cdapi/v1

# ── Scheduling (required for ReminderService auto-scan) ──────────────────────
# Add @EnableScheduling to your main Spring Boot Application class:
#
#   @SpringBootApplication
#   @EnableScheduling               ← ADD THIS
#   public class nolyvraApplication { ... }
#

