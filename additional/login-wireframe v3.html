<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepHire — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

<style>
/* ── Reset ────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── CSS Variables ────────────────────────────────────────────────────────── */
:root {
  --accent:       #1D72E8;
  --accent-bright:#3D8EFF;
  --deep1:        #060D1A;   /* darkest navy */
  --deep2:        #0A1628;
  --deep3:        #0F1F3D;
  --deep4:        #0D2757;
  --card-bg:      rgba(255,255,255,0.05);
  --card-border:  rgba(255,255,255,0.09);
  --input-bg:     rgba(255,255,255,0.07);
  --input-border: rgba(255,255,255,0.14);
  --input-focus:  rgba(29,114,232,0.7);
  --text:         #ffffff;
  --text-dim:     rgba(255,255,255,0.55);
  --text-faint:   rgba(255,255,255,0.28);
  --font:         'DM Sans', sans-serif;
  --font-display: 'DM Serif Display', serif;
}

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--deep1);
  color: var(--text);
  overflow: hidden;
}

/* ── Full-page background ────────────────────────────────────────────────── */
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 100%, #0D2F6E 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 10%,  #071B4A 0%, transparent 55%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #0A1628 0%, #060D1A 100%);
  z-index: 0;
}

/* Subtle noise grain overlay */
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.4;
  pointer-events: none;
}

/* ── Leaf SVG motif ──────────────────────────────────────────────────────── */
.leaf-wrap {
  position: fixed;
  right: -120px;
  top: -80px;
  width: 640px;
  height: 640px;
  z-index: 1;
  opacity: 0.18;
  pointer-events: none;
  animation: leafFloat 8s ease-in-out infinite;
}

.leaf-wrap-2 {
  position: fixed;
  left: -160px;
  bottom: -120px;
  width: 520px;
  height: 520px;
  z-index: 1;
  opacity: 0.10;
  pointer-events: none;
  animation: leafFloat 11s ease-in-out infinite reverse;
}

@keyframes leafFloat {
  0%,100% { transform: rotate(0deg) scale(1); }
  50%      { transform: rotate(4deg) scale(1.03); }
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.page {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ── Card ────────────────────────────────────────────────────────────────── */
.card {
  width: 100%;
  max-width: 420px;
  background: rgba(12, 24, 50, 0.72);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 40px 40px 36px;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow:
    0 0 0 1px rgba(29,114,232,0.08),
    0 32px 64px rgba(0,0,0,0.48),
    0 4px 16px rgba(0,0,0,0.32);
  animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
}

@keyframes cardIn {
  from { opacity:0; transform: translateY(20px) scale(.98); }
  to   { opacity:1; transform: translateY(0)    scale(1);   }
}

/* ── Brand ───────────────────────────────────────────────────────────────── */
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 32px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #1D72E8, #3D8EFF);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(29,114,232,0.4);
  letter-spacing: -0.3px;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 400;
  color: #fff;
  letter-spacing: -0.3px;
  line-height: 1;
}

.brand-ver {
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 2px;
  letter-spacing: 0.5px;
}

/* ── Heading ─────────────────────────────────────────────────────────────── */
.heading {
  margin-bottom: 28px;
}

.heading h1 {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.4px;
  line-height: 1.2;
  margin-bottom: 6px;
}

.heading p {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
}

/* ── Form fields ─────────────────────────────────────────────────────────── */
.form-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: fieldIn .35s cubic-bezier(.22,1,.36,1) both;
}

@keyframes fieldIn {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}

.field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* input + arrow row */
.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.field-input {
  flex: 1;
  height: 46px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 10px;
  padding: 0 16px;
  font-size: 14px;
  font-family: var(--font);
  color: #fff;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}

.field-input::placeholder {
  color: rgba(255,255,255,0.28);
}

.field-input:focus {
  border-color: var(--accent);
  background: rgba(29,114,232,0.08);
  box-shadow: 0 0 0 3px rgba(29,114,232,0.18);
}

/* arrow / chevron button */
.arrow-btn {
  flex-shrink: 0;
  width: 46px;
  height: 46px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(29,114,232,0.35);
  transition: transform .15s, box-shadow .15s, opacity .15s;
  font-size: 18px;
  line-height: 1;
}

.arrow-btn:hover {
  transform: translateX(2px);
  box-shadow: 0 6px 20px rgba(29,114,232,0.5);
}

.arrow-btn:active {
  transform: translateX(0) scale(.96);
}

.arrow-btn:disabled {
  opacity: 0.35;
  cursor: default;
  transform: none;
  box-shadow: none;
}

/* ── Submit button ───────────────────────────────────────────────────────── */
.submit-btn {
  width: 100%;
  height: 48px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #1D72E8 0%, #3D8EFF 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font);
  letter-spacing: 0.1px;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(29,114,232,0.4);
  transition: transform .15s, box-shadow .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  animation: fieldIn .35s .05s cubic-bezier(.22,1,.36,1) both;
}

.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(29,114,232,0.5);
}

.submit-btn:active {
  transform: translateY(0) scale(.98);
}

/* ── Divider ─────────────────────────────────────────────────────────────── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0 18px;
}

.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.08);
}

.divider span {
  font-size: 11px;
  color: var(--text-faint);
  white-space: nowrap;
}

/* ── SSO row ─────────────────────────────────────────────────────────────── */
.sso-row {
  display: flex;
  gap: 10px;
}

.sso-btn {
  flex: 1;
  height: 40px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--text-dim);
  font-size: 12px;
  font-family: var(--font);
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background .15s, border-color .15s, color .15s;
}

.sso-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
}

/* ── Footer note ─────────────────────────────────────────────────────────── */
.card-footer {
  margin-top: 24px;
  text-align: center;
  font-size: 11.5px;
  color: var(--text-faint);
  line-height: 1.6;
}

.card-footer a {
  color: var(--accent-bright);
  text-decoration: none;
  font-weight: 500;
}

.card-footer a:hover {
  text-decoration: underline;
}

/* ── Step indicator dots ─────────────────────────────────────────────────── */
.step-dots {
  display: flex;
  gap: 6px;
  margin-bottom: 28px;
}

.step-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  transition: all .3s;
}

.step-dot.done  { background: var(--accent); width: 18px; border-radius: 3px; }
.step-dot.active { background: #fff; }

/* ── Validation hint ─────────────────────────────────────────────────────── */
.hint {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 4px;
  padding-left: 2px;
  min-height: 16px;
  transition: color .2s;
}

.hint.error { color: #F87171; }
.hint.ok    { color: #4ADE80; }

/* ── Password reveal toggle ──────────────────────────────────────────────── */
.pw-wrap {
  position: relative;
  flex: 1;
}

.pw-wrap .field-input {
  width: 100%;
  padding-right: 44px;
}

.pw-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 14px;
  padding: 0;
  line-height: 1;
  transition: color .15s;
}

.pw-toggle:hover { color: var(--text-dim); }

/* ── Annotation strip (wireframe style) ──────────────────────────────────── */
.annot-strip {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 10;
}

.annot {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  font-family: var(--font);
  white-space: nowrap;
}

/* ── Hidden utility ──────────────────────────────────────────────────────── */
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ── Background ──────────────────────────────────────────────────────────── -->
<div class="bg"></div>

<!-- ── Leaf motif (top-right) ──────────────────────────────────────────────── -->
<div class="leaf-wrap">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
      <radialGradient id="leafGrad1" cx="35%" cy="30%" r="70%">
        <stop offset="0%"   stop-color="#3D8EFF" stop-opacity="1"/>
        <stop offset="55%"  stop-color="#1D72E8" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
      </radialGradient>
      <filter id="blur1"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <!-- Main leaf shape -->
    <path d="M200 20 C310 20 380 100 380 200 C380 310 300 385 200 385 C90 385 18 300 20 200 C22 90 90 20 200 20 Z"
          fill="url(#leafGrad1)" opacity="0.9"/>
    <!-- Inner vein -->
    <path d="M200 40 C290 80 340 150 320 260 C300 340 240 375 200 385"
          stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none"/>
    <path d="M200 40 C180 120 160 200 130 300"
          stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
    <!-- Highlight shimmer -->
    <ellipse cx="150" cy="130" rx="60" ry="90" fill="rgba(255,255,255,0.07)"
             transform="rotate(-20 150 130)" filter="url(#blur1)"/>
  </svg>
</div>

<!-- ── Leaf motif (bottom-left, secondary) ───────────────────────────────────── -->
<div class="leaf-wrap-2">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
      <radialGradient id="leafGrad2" cx="60%" cy="65%" r="65%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.6"/>
        <stop offset="50%"  stop-color="#1D72E8" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#0A1628" stop-opacity="0.1"/>
      </radialGradient>
    </defs>
    <path d="M200 15 C315 15 385 100 385 205 C385 315 300 388 200 388 C88 388 15 302 15 200 C15 88 90 15 200 15 Z"
          fill="url(#leafGrad2)"/>
    <path d="M200 40 C285 90 330 170 310 275 C290 355 238 382 200 388"
          stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>
  </svg>
</div>

<!-- ── Login Card ───────────────────────────────────────────────────────────── -->
<div class="page">
  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">IQ</div>
      <div>
        <div class="brand-name">DeepHire</div>
        <div class="brand-ver">MVP v0.1</div>
      </div>
    </div>

    <!-- Step dots -->
    <div class="step-dots" id="stepDots">
      <div class="step-dot active" id="dot0"></div>
      <div class="step-dot"        id="dot1"></div>
      <div class="step-dot"        id="dot2"></div>
    </div>

    <!-- Heading (updates per step) -->
    <div class="heading">
      <h1 id="headingTitle">Welcome!</h1>
      <p  id="headingDesc">Enter your email to continue to DeepHire.</p>
    </div>

    <!-- Form -->
    <div class="form-stack">

      <!-- ── STEP 1: Email ── -->
      <div class="field-group" id="emailGroup">
        <div class="field-label">Email</div>
        <div class="input-row">
          <input
            class="field-input"
            id="emailInput"
            type="email"
            placeholder="you@company.com"
            autocomplete="email"
            autofocus
          />
          <button class="arrow-btn" id="emailArrow" onclick="submitEmail()" title="Continue" disabled>
            →
          </button>
        </div>
        <div class="hint" id="emailHint"></div>
      </div>

      <!-- ── STEP 2: Password (hidden initially) ── -->
      <div class="field-group hidden" id="passwordGroup">
        <div class="field-label">Password</div>
        <div class="input-row">
          <div class="pw-wrap">
            <input
              class="field-input"
              id="passwordInput"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button class="pw-toggle" onclick="togglePw()" id="pwToggle" title="Show / hide">👁</button>
          </div>
        </div>
        <div class="hint" id="passwordHint"></div>
      </div>

      <!-- ── STEP 3: Submit (hidden initially) ── -->
      <button class="submit-btn hidden" id="submitBtn" onclick="handleSubmit()">
        <span>Sign In to DeepHire</span>
        <span>→</span>
      </button>

    </div>

    <!-- Footer -->
    <div class="card-footer">
      <span style="font-size:10px;color:rgba(255,255,255,0.18);display:block">
        Protected by DeepHire · <a href="#" style="color:rgba(255,255,255,0.25)">Privacy Policy</a>
      </span>
    </div>

  </div>
</div>



<script>
// ── Email input → enable arrow ────────────────────────────────────────────
const emailInput    = document.getElementById('emailInput');
const emailArrow    = document.getElementById('emailArrow');
const emailHint     = document.getElementById('emailHint');
const passwordGroup = document.getElementById('passwordGroup');
const passwordInput = document.getElementById('passwordInput');
const passwordHint  = document.getElementById('passwordHint');
const submitBtn     = document.getElementById('submitBtn');
const headingTitle  = document.getElementById('headingTitle');
const headingDesc   = document.getElementById('headingDesc');
const dot0 = document.getElementById('dot0');
const dot1 = document.getElementById('dot1');
const dot2 = document.getElementById('dot2');

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
}

// Enable arrow as user types a valid email
emailInput.addEventListener('input', () => {
  const valid = isValidEmail(emailInput.value);
  emailArrow.disabled = !valid;
  if (emailInput.value.length > 0 && !valid) {
    emailHint.textContent = 'Enter a valid work email';
    emailHint.className = 'hint error';
  } else {
    emailHint.textContent = '';
    emailHint.className = 'hint';
  }
});

// Press Enter on email field
emailInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !emailArrow.disabled) submitEmail();
});

// ── Step 1 → Step 2: reveal password ─────────────────────────────────────
function submitEmail() {
  if (!isValidEmail(emailInput.value)) return;

  // Freeze email field
  emailInput.readOnly = true;
  emailInput.style.opacity = '0.55';
  emailArrow.style.display = 'none';
  emailHint.textContent = '✓ Email confirmed';
  emailHint.className = 'hint ok';

  // Update step dots
  dot0.classList.remove('active');
  dot0.classList.add('done');
  dot1.classList.add('active');

  // Update heading
  headingTitle.textContent = 'Enter your password';
  headingDesc.textContent  = 'Signing in as ' + emailInput.value.trim();

  // Reveal password
  passwordGroup.classList.remove('hidden');
  setTimeout(() => passwordInput.focus(), 50);

  // Listen for password input
  passwordInput.addEventListener('input', onPasswordInput);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && passwordInput.value.length >= 6) showSubmit();
  });
}

// ── Step 2 → Step 3: reveal submit button ────────────────────────────────
function onPasswordInput() {
  const len = passwordInput.value.length;
  if (len > 0 && len < 6) {
    passwordHint.textContent = `${6 - len} more character${6 - len === 1 ? '' : 's'} needed`;
    passwordHint.className = 'hint';
  } else if (len === 0) {
    passwordHint.textContent = '';
    passwordHint.className = 'hint';
    submitBtn.classList.add('hidden');
    dot2.classList.remove('active');
    dot1.classList.add('active');
  } else {
    passwordHint.textContent = '✓ Password entered';
    passwordHint.className = 'hint ok';
    showSubmit();
  }
}

function showSubmit() {
  if (passwordInput.value.length < 6) return;
  submitBtn.classList.remove('hidden');

  // Update step dots
  dot1.classList.remove('active');
  dot1.classList.add('done');
  dot2.classList.add('active');

  // Update heading
  headingTitle.textContent = 'Ready to sign in';
  headingDesc.textContent  = 'Click below to access your DeepHire workspace.';
}

// ── Password show/hide ────────────────────────────────────────────────────
let pwVisible = false;
function togglePw() {
  pwVisible = !pwVisible;
  passwordInput.type = pwVisible ? 'text' : 'password';
  document.getElementById('pwToggle').textContent = pwVisible ? '🙈' : '👁';
}

// ── Submit (wireframe: just shows loading state) ──────────────────────────
function handleSubmit() {
  const btn = document.getElementById('submitBtn');
  btn.innerHTML = '<span style="opacity:.6;font-size:13px">Signing in…</span>';
  btn.disabled = true;
  btn.style.opacity = '0.75';

  // Wireframe: simulate redirect after 1.5s
  setTimeout(() => {
    btn.innerHTML = '<span>✓ Signed in — redirecting to Dashboard</span>';
    btn.style.background = 'linear-gradient(135deg,#16A34A,#22C55E)';
    btn.style.opacity = '1';
  }, 1500);
}
</script>
</body>
</html>
